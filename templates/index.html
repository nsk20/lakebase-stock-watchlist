<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real-Time Stock Watchlist</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --success: #22c55e;
      --error: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 20px;
    }

    .container {
      width: 100%;
      max-width: 680px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 32px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    header {
      margin-bottom: 24px;
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    h1::before {
      content: "";
      display: inline-block;
      width: 12px;
      height: 12px;
      background-color: var(--success);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--success);
    }

    .hint {
      color: var(--text-muted);
      font-size: 14px;
      margin-top: 8px;
      line-height: 1.5;
    }

    form {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }

    .input-group {
      flex: 1;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px 16px;
      background-color: #0f172a;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-main);
      font-size: 15px;
      font-weight: 500;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: var(--accent);
    }

    button {
      padding: 12px 24px;
      background-color: var(--accent);
      color: #0f172a;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }

    button:hover {
      background-color: var(--accent-hover);
      color: #ffffff;
    }

    button:active {
      transform: scale(0.98);
    }

    #result {
      margin-top: 16px;
      font-size: 14px;
      min-height: 20px;
      color: var(--accent);
    }

    .table-container {
      margin-top: 28px;
      overflow-x: auto;
      border: 1px solid var(--border-color);
      border-radius: 8px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th {
      background-color: #0f172a;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-color);
    }

    td {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border-color);
      font-size: 14px;
      color: var(--text-main);
    }

    tr:last-child td {
      border-bottom: none;
    }

    .ticker-badge {
      font-weight: 700;
      color: var(--accent);
      background: rgba(56, 189, 248, 0.1);
      padding: 4px 8px;
      border-radius: 4px;
    }

    .price-tag {
      font-family: monospace;
      font-size: 15px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Real-Time Stock Watchlist</h1>
      <p class="hint">Enter a ticker symbol to fetch live market updates via Massive API and synchronize data to Databricks Lakebase.</p>
    </header>

    <form id="stock-form">
      <div class="input-group">
        <input type="text" id="symbol" name="symbol" placeholder="e.g. AAPL, NVDA, MSFT" required>
      </div>
      <button type="submit">Add to Watchlist</button>
    </form>

    <div id="result"></div>

    <div class="table-container">
      <table id="watchlist-table">
        <thead>
          <tr>
            <th>Symbol</th>
            <th>User Email</th>
            <th>Latest Price</th>
            <th>Last Updated</th>
          </tr>
        </thead>
        <tbody id="watchlist-body"></tbody>
      </table>
    </div>
  </div>

  <script>
    const form = document.getElementById("stock-form");
    const resultEl = document.getElementById("result");
    const watchlistBody = document.getElementById("watchlist-body");

    async function loadWatchlist() {
      try {
        const resp = await fetch("/watchlist");
        const data = await resp.json();
        if (!resp.ok) {
          resultEl.textContent = "Error loading watchlist: " + (data.error || resp.statusText);
          resultEl.style.color = "var(--error)";
          return;
        }
        watchlistBody.innerHTML = "";
        data.forEach((row) => {
          const tr = document.createElement("tr");
          const price = row.latest_price !== null && row.latest_price !== undefined
            ? "$" + Number(row.latest_price).toFixed(2)
            : "-";
          const updated = row.updated_at ? new Date(row.updated_at).toLocaleString() : "-";
          tr.innerHTML = `
            <td><span class="ticker-badge">${row.symbol}</span></td>
            <td>${row.email || "-"}</td>
            <td><span class="price-tag">${price}</span></td>
            <td>${updated}</td>
          `;
          watchlistBody.appendChild(tr);
        });
      } catch (err) {
        resultEl.textContent = "Failed to load watchlist: " + err;
        resultEl.style.color = "var(--error)";
      }
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const symbolInput = document.getElementById("symbol");
      const symbol = symbolInput.value;
      resultEl.style.color = "var(--accent)";
      resultEl.textContent = "Fetching ticker details and syncing to Lakebase...";

      try {
        const resp = await fetch("/watchlist", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ symbol }),
        });
        const data = await resp.json();
        if (!resp.ok) {
          resultEl.style.color = "var(--error)";
          resultEl.textContent = "Error: " + (data.error || resp.statusText);
          return;
        }
        resultEl.style.color = "var(--success)";
        resultEl.textContent = `Successfully added ${data.symbol} ($${data.latest_price}) to watchlist!`;
        symbolInput.value = "";
        loadWatchlist();
      } catch (err) {
        resultEl.style.color = "var(--error)";
        resultEl.textContent = "Request failed: " + err;
      }
    });

    loadWatchlist();
  </script>
</body>
</html>
